# Lower the default tmux delay, this makes tmux more responsive.
set -s escape-time 1

# Enable mouse support
set -g mouse on

# make scrolling with wheels work
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# Make tmux use 256 colors.
set -g default-terminal "screen-256color"

# Only resize the screen size if the smaller screen user has their window
# active. This way my screen won't be resized to an incredibly small window
# unnecessarily.
setw -g aggressive-resize on

# Store a lot of history.
set -g history-limit 200000
#####

# get notifications in case something happens in other windows
#setw -g monitor-activity on
#set -g visual-activity on

# default statusbar colors
#set -g status-fg white
#set -g status-bg black
#set -g status-style bright

# Highlighting Current Window Using Specified Colour
#set-window-option -g window-status-current-style fg=black
set-window-option -g window-status-current-style bg=yellow
#set-window-option -g window-status-current-style bright

# split window vertically with |
bind-key | split-window -h
unbind %

# split window horizontally with -
bind-key - split-window -v
unbind '"'

# move window using ctrl+shift+<arrow left|right>
# parameter -n indicates that the root key table is used.
# this means it works without ctrl+<prefix>
bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

# change key bindings for resizing panes
bind -n M-H resize-pane -L 2
bind -n M-L resize-pane -R 2
bind -n M-K resize-pane -U 2
bind -n M-J resize-pane -D 2

# change keys for switching between panes in split mode
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

set -g status-interval 30
set -g status-right-length 150
# set -g status-right '#[fg=white]#H|%Y-%m-%d %H:%M#[default]'
set -g status-right "| #(whoami)@#H | #(awk '{print $1,$2,$3}' /proc/loadavg) | %Y-%m-%d %H:%M "

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

# Load config dynamically
unbind r
bind r source-file ~/.tmux.conf
